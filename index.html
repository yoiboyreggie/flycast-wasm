<!DOCTYPE html>
<html>
<head>
    <title>Workspace Simulation</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#222; overflow:hidden; font-family:sans-serif; }
        #canvas-container { display:flex; flex-direction:column; justify-content:center; align-items:center; width:100vw; height:100vh; }
        canvas { width:100vw !important; height:56.25vw !important; max-height:85vh !important; max-width:177.78vh !important; background:#111; display:none; }
        #picker-ui { color:#fff; text-align:center; padding:20px; border:2px dashed #555; background:#1a1a1a; border-radius:8px; }
        button { background:#007bff; color:#fff; border:none; padding:10px 20px; font-size:16px; border-radius:4px; cursor:pointer; margin-top:10px; }
        button:hover { background:#0056b3; }
    </style>
</head>
<body>
<div id="canvas-container">
    <div id="picker-ui">
        <h3>Marvel vs. Capcom 2 Web Terminal</h3>
        <p>Select your Dreamcast files to start:</p>
        <div>
            <label>1. System BIOS (dc_boot.bin):</label><br>
            <input type="file" id="bios-input"><br><br>
            <label>2. Game ROM (mvc2.cdi or .chd):</label><br>
            <input type="file" id="game-input">
        </div>
        <button id="start-btn">Launch Widescreen Emulator</button>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
</div>
<script>
    var biosFile, gameFile;
    document.getElementById('bios-input').onchange = function(e) { biosFile = e.target.files[0]; };
    document.getElementById('game-input').onchange = function(e) { gameFile = e.target.files[0]; };

    document.getElementById('start-btn').onclick = function() {
        if (!biosFile || !gameFile) {
            alert('Please select BOTH the 2MB BIOS file and your mvc2 game file first!');
            return;
        }
        
        document.getElementById('picker-ui').style.display = 'none';
        document.getElementById('canvas').style.display = 'block';

        // FIX: Creating a virtual filesystem memory layer inside the browser tab
        Module['FS_createDataFile']('/', 'dc_boot.bin', new Uint8Array([]), true, true);
        Module['FS_createDataFile']('/', 'game.cdi', new Uint8Array([]), true, true);

        var reader1 = new FileReader();
        reader1.onload = function() {
            Module['FS'].writeFile('/dc_boot.bin', new Uint8Array(reader1.result));
            
            var reader2 = new FileReader();
            reader2.onload = function() {
                Module['FS'].writeFile('/game.cdi', new Uint8Array(reader2.result));
                
                // Forces arguments to bind to our newly made virtual memory files
                Module['arguments'] = ['-bios', '/dc_boot.bin', '-game', '/game.cdi'];
                
                var loadScript = document.createElement('script');
                loadScript.src = 'build/prod/flycast.js';
                document.head.appendChild(loadScript);
            };
            reader2.readAsArrayBuffer(gameFile);
        };
        reader1.readAsArrayBuffer(biosFile);
    };

    var Module = {
        canvas: document.getElementById('canvas'),
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        preRun: [function() { Module['FS'] = FS; }]
    };
</script>
</body>
</html>
