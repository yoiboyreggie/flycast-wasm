<!DOCTYPE html>
<html>

    <title>Workspace Simulation</title>

        #canvas-container { display:flex; justify-content:center; align-items:center; width:100vw; height:100vh; }
        canvas { width:100vw !important; height:56.25vw !important; max-height:100vh !important; max-width:177.78vh !important; background:#111; }
    </style>
</head>
<body>
<div id="canvas-container"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
<script>
    var Module = {
        canvas: document.getElementById('canvas'),
        arguments: [
            '-bios', 'YOUR_DIRECT_DOWNLOAD_BIOS_URL_HERE', 
            '-game', 'YOUR_DIRECT_DOWNLOAD_ROM_URL_HERE'
        ],
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); }
    };
</script>
<script src="build/prod/flycast.js"></script>
