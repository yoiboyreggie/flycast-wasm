<!DOCTYPE html>
<html>
<head>
    <title>Workspace Simulation</title>
    <!-- Forces the browser to unblock WebAssembly multi-threading features -->
    <script src="coi-serviceworker.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#222; overflow:hidden; font-family:sans-serif; }
        #canvas-container { display:flex; flex-direction:column; justify-content:center; align-items:center; width:100vw; height:100vh; }
        #game { width:100% !important; height:100% !important; }
        #picker-ui { color:#fff; text-align:center; padding:30px; border:2px dashed #555; background:#1a1a1a; border-radius:8px; width:350px; }
        button { background:#007bff; color:#fff; border:none; padding:12px 24px; font-size:16px; border-radius:4px; cursor:pointer; margin-top:15px; width:100%; font-weight:bold; }
        button:hover { background:#0056b3; }
        input[type="file"] { margin: 10px 0 20px 0; color: #ccc; }
        #status-msg { margin-top: 15px; color: #ffc107; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
<div id="canvas-container">
    <div id="picker-ui">
        <h3>Marvel vs. Capcom 2 Web Terminal</h3>
        <p style="color:#aaa; font-size:14px; margin-bottom:20px;">Mount system assets locally into workspace RAM:</p>
        <div style="text-align:left;">
            <label style="font-weight:bold;">1. System BIOS (dc_boot.bin):</label><br>
            <input type="file" id="bios-input"><br>
            <label style="font-weight:bold;">2. Game ROM (Marvel vs Capcom 2.cdi):</label><br>
            <input type="file" id="game-input">
        </div>
        <button id="start-btn">Launch Widescreen Emulator</button>
        <div id="status-msg"></div>
    </div>
    <div id="game"></div>
</div>
<script>
    var status = document.getElementById('status-msg');
    
    document.getElementById('start-btn').onclick = function() {
        var biosInput = document.getElementById('bios-input').files[0];
        var gameInput = document.getElementById('game-input').files[0];

        if (!biosInput || !gameInput) {
            status.innerText = "Error: Select BOTH files before booting!";
            return;
        }

        status.innerText = "Creating localized memory streams...";
        
        // Bypasses browser size crashes by transforming files into virtual memory URLs
        var biosURL = URL.createObjectURL(biosInput);
        var gameURL = URL.createObjectURL(gameInput);

        document.getElementById('picker-ui').style.display = 'none';

        // Initializing the canonical EmulatorJS configuration framework definitions
        EJS_player = '#game';
        EJS_core = 'dreamcast'; 
        EJS_gameName = "Marvel vs Capcom 2";
        
        // CRUCIAL FIX: Points the system directly to the engine folders inside your fork
        EJS_pathtodata = './build/prod/'; 
        
        EJS_bios = biosURL; 
        EJS_gameUrl = gameURL; 

        EJS_Settings = {
            widescreen: true, 
            aspectRatio: "16:9",
            vSync: false,
            startInFullscreen: false
        };

        // Injecting the core framework configuration builder script dynamically
        var loadScript = document.createElement('script');
        loadScript.src = 'https://' + 'cdn.' + 'emulatorjs' + '.org/stable/data/loader.js';
        
        loadScript.onerror = function() {
            status.innerText = "Framework loader error. Check network restrictions.";
            document.getElementById('picker-ui').style.display = 'block';
        };

        document.head.appendChild(loadScript);
    };
</script>
</body>
</html>
